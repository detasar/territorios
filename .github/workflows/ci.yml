name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install --yes sqlite3
      - run: npm ci
      - run: npm audit
      - run: npm run verify:migration
      - run: npm run verify
      - name: Initialize local D1
        run: npx wrangler d1 migrations apply site-creator-d1 --local
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
